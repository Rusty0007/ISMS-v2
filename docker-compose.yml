services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  db:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: isms_db
      POSTGRES_USER: isms_user
      POSTGRES_PASSWORD: isms_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c log_min_duration_statement=500
      -c log_destination=stderr
      -c logging_collector=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isms_user -d isms_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@isms.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "10"
    ports:
      - "5050:80"
    depends_on:
      - db

  # ── Pre-deploy migration runner ──────────────────────────────────────────
  # In production, run `docker compose run --rm migrate` BEFORE starting
  # the backend to avoid holding ACCESS EXCLUSIVE locks while serving traffic.
  # For local development the backend runs migrations inline on startup anyway.
  migrate:
    build: ./backend
    command: python migrate.py
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://isms_user:isms_password@db:5432/isms_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles:
      - migrate

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql://isms_user:isms_password@db:5432/isms_db
      LOCAL_DB_URL: postgresql://isms_user:isms_password@db:5432/isms_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).getcode() == 200 else sys.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


  # ── Celery worker ────────────────────────────────────────────────────────
  # Processes background tasks: reminders, feed notifications, and insights.
  # SMS uses its own worker below so time-critical texts do not wait behind
  # unrelated queue load.
  celery-worker:
    build: ./backend
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,feed,insights
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://isms_user:isms_password@db:5432/isms_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated worker for time-critical UniSMS notifications.
  celery-sms-worker:
    build: ./backend
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=sms
      --hostname=sms@%h
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://isms_user:isms_password@db:5432/isms_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery beat (periodic task scheduler) ────────────────────────────────
  # Exactly ONE beat process must run at a time — never scale this service.
  # Sends tasks to the broker on schedule (tournament reminders every 60 s,
  # open-play expiry every 120 s).
  celery-beat:
    build: ./backend
    command: >
      celery -A app.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://isms_user:isms_password@db:5432/isms_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Flower (Celery monitoring UI) ─────────────────────────────────────────
  # Dashboard at http://localhost:5555 — shows tasks, workers, queues.
  flower:
    build: ./backend
    command: >
      celery -A app.celery_app flower
      --port=5555
      --broker=redis://redis:6379
    ports:
      - "5555:5555"
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    restart: unless-stopped

  # ── Reverse proxy with rate limiting ────────────────────────────────────────
  # Handles auth rate limiting, SSE timeouts, security headers.
  # Access the app via http://localhost (port 80) instead of port 3000/8000.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment after adding SSL certs to nginx/certs/:
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment to enable HTTPS:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Automated database backup ─────────────────────────────────────────────
  # Runs pg_dump daily and stores timestamped backups in ./backups/
  # Keeps the last 7 days of backups automatically.
  # Manual trigger: POST /api/admin/backup/trigger
  db-backup:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      PGPASSWORD: isms_password
      PGHOST: db
      PGUSER: isms_user
      PGDATABASE: isms_db
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
  uploads_data:
