##
## ISMS Production Nginx Reverse Proxy
##
## Security features:
##  - Rate limiting on auth, admin, and API endpoints
##  - Request size limits to prevent abuse
##  - Security headers
##  - SSL-ready (uncomment HTTPS block and add certs to enable)
##

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Each zone is keyed by client IP.  Burst allows short spikes; nodelay
    # rejects over-limit requests immediately rather than queuing them.

    # Auth endpoints — strict: 10 req/min per IP (login, register, refresh)
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;

    # Admin panel — moderate: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=admin:10m    rate=60r/m;

    # General API — relaxed: 120 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:20m      rate=120r/m;

    # Export downloads — very relaxed (CSV can be large): 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=export:5m    rate=10r/m;

    # Return 429 Too Many Requests (not 503) when rate limit is exceeded
    limit_req_status 429;

    # ── Upstream services ──────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ── HTTP server (port 80) ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Limit request body to 10 MB (avatar uploads, CSV imports)
        client_max_body_size 10m;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"              always;
        add_header X-Content-Type-Options "nosniff"                 always;
        add_header X-XSS-Protection       "1; mode=block"           always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Auth endpoints — strict rate limiting ─────────────────────────────
        location ~ ^(/api)?/(auth/login|auth/register|auth/refresh) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_log_level warn;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── Admin endpoints ───────────────────────────────────────────────────
        location ~ ^(/api)?/admin/ {
            limit_req zone=admin burst=20 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Export endpoints — allow larger downloads ─────────────────────────
        location ~ ^(/api)?/[^/]+/export/ {
            limit_req zone=export burst=5 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass          http://backend;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_buffering     off;
        }

        # ── SSE endpoints — long-lived HTTP streams ───────────────────────────
        location ~ ^(/api)?/(matches/[^/]+/stream|tournaments/[^/]+/stream|players/me/notifications/stream|auth/session/stream|lobby/[^/]+/stream|open-play/[^/]+/stream) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_ignore_client_abort off;
        }

        # ── WebSocket (match live updates) ────────────────────────────────────
        location ~ ^/matches/ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=40 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
        }
    }

    # ── HTTPS server (port 443) — uncomment after adding SSL certificate ───────
    # To enable:
    #   1. Place your certificate:   nginx/certs/fullchain.pem
    #   2. Place your private key:   nginx/certs/privkey.pem
    #   3. For self-signed (dev):
    #      mkdir -p nginx/certs
    #      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #        -keyout nginx/certs/privkey.pem -out nginx/certs/fullchain.pem \
    #        -subj "/CN=localhost"
    #   4. Uncomment the block below and add the certs volume to nginx in docker-compose.yml:
    #      - ./nginx/certs:/etc/nginx/certs:ro
    #
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     client_max_body_size 10m;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Add the same location blocks as the HTTP server above
    # }
    #
    # HTTP → HTTPS redirect (replace the HTTP server block above with this):
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }
}
